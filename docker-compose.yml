services:
  web:
    build: .
    container_name: ipermabot-pwa
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_DIR=/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./app:/app/app:ro
      - ./docs:/docs:ro
