  <!-- ============== LINHA DE NOTAS ============== -->
  <rect x="40" y="1350" width="1200" height="420" rx="10" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>

  <text x="60" y="1380" class="b" fill="#1F4E79" font-size="16">PRINCÍPIOS DE UX QUE GOVERNAM TODAS AS 6 TELAS</text>

  <text x="60" y="1410" class="nota">1.</text>
  <text x="90" y="1410" class="bpeq">Botão PARAR deve estar SEMPRE visível em todas as telas durante operação. Nunca escondido atrás de menu.</text>

  <text x="60" y="1438" class="nota">2.</text>
  <text x="90" y="1438" class="bpeq">Estados têm cor semântica universal: verde=ok, amarelo=alerta, vermelho=parar/emergência, azul=informação.</text>

  <text x="60" y="1466" class="nota">3.</text>
  <text x="90" y="1466" class="bpeq">Cada botão grande tem ≥ 60 px de altura para toque confortável com luva (uso típico em obra).</text>

  <text x="60" y="1494" class="nota">4.</text>
  <text x="90" y="1494" class="bpeq">Texto mínimo de 16 px; nada abaixo disso (legibilidade sob sol).</text>

  <text x="60" y="1522" class="nota">5.</text>
  <text x="90" y="1522" class="bpeq">Telas de configuração (4) só acessíveis quando robô está PARADO. Operador não pode mudar configuração durante operação.</text>

  <text x="60" y="1550" class="nota">6.</text>
  <text x="90" y="1550" class="bpeq">App funciona 100% offline (AP direto). Não depende de internet para operar.</text>

  <text x="60" y="1578" class="nota">7.</text>
  <text x="90" y="1578" class="bpeq">Tela de emergência (3) tem fundo vermelho ocupando tela inteira — nenhum distrair.</text>

  <text x="60" y="1606" class="nota">8.</text>
  <text x="90" y="1606" class="bpeq">Confirmações exigem segurar botão por 2-3s em ações destrutivas (reset, abortar obra).</text>

  <text x="60" y="1634" class="nota">9.</text>
  <text x="90" y="1634" class="bpeq">Modo simulação (acesso sem hardware) para treinamento e demonstração comercial.</text>

  <text x="60" y="1662" class="nota">10.</text>
  <text x="90" y="1662" class="bpeq">Logs (tela 6) exportáveis em PDF para incluir como anexo ao relatório da obra entregue ao cliente.</text>

  <text x="60" y="1700" class="b">CUSTO ESTIMADO DO DESENVOLVIMENTO (versão MVP — primeiro entregável funcional):</text>

  <text x="90" y="1722" class="bpeq">• Versão só com telas 1, 2 e 3 (conexão + dashboard + emergência): R$ 6.000 a R$ 12.000 (dev freelancer, 30-45 dias)</text>
  <text x="90" y="1744" class="bpeq">• Versão completa (6 telas + simulação + export PDF): R$ 18.000 a R$ 35.000 (dev freelancer sênior, 60-90 dias)</text>

